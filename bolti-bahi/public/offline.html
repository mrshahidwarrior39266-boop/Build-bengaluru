<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2D5016">
  <title>Bolti Bahi — Offline</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #F5F0EB;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 340px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 18px;
      border-radius: 22px; background: #2D5016;
      display: grid; place-items: center; font-size: 34px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #5F5F5F; font-size: 0.92rem; line-height: 1.5; margin: 0 0 20px; }
    button {
      border: 0; border-radius: 12px; padding: 13px 22px;
      background: #2D5016; color: #fff; font-size: 0.95rem; font-weight: 700;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">🎙️</div>
    <h1>Bolti Bahi offline hai</h1>
    <p>App khul gaya, lekin khata server se juda nahi hai. Internet aane par dobara koshish karein — aapka hisaab server par surakshit hai.</p>
    <button type="button" onclick="location.replace('/')">Dobara koshish karein</button>
  </div>
</body>
</html>
